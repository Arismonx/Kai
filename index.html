<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8ed1fc">
<title>ฟาร์มไก่กลม</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill" id="lvl"><span id="lvlname"></span><div class="bar"><i id="xpbar"></i></div></div>
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="pill">🥚 <span id="eggs">0</span></div>
  </div>
  <div id="stats">
    <div class="stat">🌾 อิ่ม<div class="bar"><i id="sHunger"></i></div></div>
    <div class="stat">💖 สุข<div class="bar"><i id="sHappy"></i></div></div>
    <div class="stat">🫧 สะอาด<div class="bar"><i id="sClean"></i></div></div>
  </div>

  <div id="subbar"><button id="bLb">🏆 อันดับ</button></div>

  <div id="farm">
    <div id="sky"></div>
    <div id="barn">🏠</div>
    <div id="fence"></div>
    <div id="cosmos"></div>
    <div id="bubble"></div>
    <div id="incub"></div>
    <div id="dog">🐕</div>
    <div id="warn"></div>
  </div>

  <div id="actions">
    <button class="btn" id="bFeed"><b>🌾</b>ให้อาหาร<small id="grainCnt"></small></button>
    <button class="btn" id="bWash"><b>🛁</b>อาบน้ำ</button>
    <button class="btn" id="bSell"><b>💰</b>ขายไข่<small id="sellInfo"></small></button>
    <button class="btn" id="bFlock"><b>🐔</b>ฝูงไก่<small id="flockCnt"></small></button>
    <button class="btn" id="bShop"><b>🛒</b>ร้านค้า</button>
  </div>

  <div id="shop" class="ov"><div id="sheet" class="sheet"></div></div>
  <div id="flock" class="ov"><div id="fsheet" class="sheet"></div></div>
  <div id="lb" class="ov"><div id="lsheet" class="sheet"></div></div>
  <div id="gacha" class="ov"><div id="gsheet" class="sheet"></div></div>
  <div id="dress" class="ov"><div id="dsheet" class="sheet"></div></div>
  <div id="modal" class="ov"><div id="msheet" class="sheet"></div></div>
  <div id="toast"></div>
</div>

<script src="game.js"></script>
</body>
</html>
